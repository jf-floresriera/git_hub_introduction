<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">Trabajar con ramas</title>
  <desc id="d">Se crea una rama desde main, se hacen tres commits, se sube con push, se integra a main con un pull request y se actualiza la copia local con git pull.</desc>
  <rect width="1200" height="330" rx="14" fill="#0d1117"/>
  <text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Trabajar con ramas</text>
  <text x="40" y="72" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Cada cambio grande va en su propia rama; main queda estable hasta que el cambio se revisa e integra.</text>
