<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
  <title id="t">Cómo viaja un cambio en Git</title>
  <desc id="d">Un archivo pasa del directorio de trabajo al área de preparación con git add, al repositorio local con git commit y a GitHub con git push. De vuelta, git fetch trae el historial remoto y git pull lo integra en tus archivos.</desc>
  <defs>
    <marker id="punta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker>
    <marker id="puntaM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a371f7"/></marker>
  </defs>
  <rect width="1200" height="470" rx="14" fill="#0d1117"/>
  <text x="40" y="50" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Cómo viaja un cambio en Git</text>
  <text x="40" y="78" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Tres zonas en tu equipo y una en la nube. Los comandos mueven los cambios de una a otra.</text>
