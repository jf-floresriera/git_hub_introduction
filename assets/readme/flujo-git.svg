<rect x="335" y="110" width="226" height="150" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/><rect x="335" y="110" width="226" height="150" rx="14" fill="none" stroke="#d29922" stroke-width="3" opacity="0.2"><animate attributeName="opacity" values="0.2;0.2;1;0.35;0.2" keyTimes="0.0000;0.2200;0.2600;0.4000;1.0000" dur="10.0s" repeatCount="indefinite"/></rect><rect x="335" y="110" width="226" height="6" rx="3" fill="#d29922"/><text x="448.0" y="158" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e6edf3" text-anchor="middle">Área de preparación</text><text x="448.0" y="194" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">staging: lo que irá</text><text x="448.0" y="216" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">en el próximo commit</text>
