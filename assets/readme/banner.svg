<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
  <title id="t">Introducción a GitHub: control de versiones y colaboración en la nube</title>
  <desc id="d">Banner animado: un grafo de commits con una rama que se une a main, y un pulso que recorre las etapas crear repositorio, clonar, commit, push y pull request.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a2b"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/><stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="rejilla" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2f81f7" stroke-opacity="0.07" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="10s" repeatCount="indefinite"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#rejilla)"/>
  <rect x="0" y="0" width="8" height="360" fill="url(#acento)"/>

  <text x="60" y="70" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="14" fill="#3fb950" letter-spacing="4">CONTROL DE VERSIONES  ·  COLABORACIÓN  ·  NUBE</text>
  <text x="60" y="128" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#e6edf3">Introducción a GitHub</text>
  <text x="60" y="166" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" fill="#c9d1d9">Git en el navegador, el escritorio y la terminal</text>
  <text x="60" y="196" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Windows · Linux · comandos esenciales · servicios de la plataforma</text>

  <g>
    <line x1="760" y1="150" x2="1130" y2="150" stroke="#2f81f7" stroke-width="4" stroke-linecap="round" stroke-dasharray="370" stroke-dashoffset="370"><animate attributeName="stroke-dashoffset" values="370;370;0;0;370" keyTimes="0.0000;0.0200;0.7500;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></line>
    <path d="M830 150 C860 150 860 86 890 86 L1005 86 C1030 86 1035 150 1060 150" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round" stroke-dasharray="300" stroke-dashoffset="300"><animate attributeName="stroke-dashoffset" values="300;300;0;0;300" keyTimes="0.0000;0.1500;0.6200;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></path>
    <circle cx="760" cy="150" r="0" fill="#0d1117" stroke="#2f81f7" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.0300;0.0600;0.0900;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="150" r="0" fill="#0d1117" stroke="#2f81f7" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.1300;0.1600;0.1900;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="150" r="0" fill="#0d1117" stroke="#2f81f7" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.6600;0.6900;0.7200;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="150" r="0" fill="#0d1117" stroke="#2f81f7" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.7400;0.7700;0.8000;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="890" cy="86" r="0" fill="#0d1117" stroke="#3fb950" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.3000;0.3300;0.3600;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="86" r="0" fill="#0d1117" stroke="#3fb950" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.4200;0.4500;0.4800;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <circle cx="1005" cy="86" r="0" fill="#0d1117" stroke="#3fb950" stroke-width="4"><animate attributeName="r" values="0;0;11;8;8;0" keyTimes="0.0000;0.5300;0.5600;0.5900;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></circle>
    <text x="752" y="184" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" fill="#2f81f7" text-anchor="start" opacity="0">main<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0300;0.0800;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></text>
    <text x="950" y="64" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" fill="#3fb950" text-anchor="middle" opacity="0">mi-rama<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3000;0.3500;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></text>
    <text x="1060" y="184" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="13" fill="#a371f7" text-anchor="middle" opacity="0">merge<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.6600;0.7100;0.9400;1.0000" dur="9.0s" repeatCount="indefinite"/></text>
  </g>

  <g>
    <line x1="120" y1="290" x2="1080" y2="290" stroke="#30363d" stroke-width="3"/>
    <rect x="120" y="287" width="0" height="6" fill="url(#brillo)"><animate attributeName="width" values="0;960;960;0" keyTimes="0;0.9;0.93;1" dur="8.0s" repeatCount="indefinite"/></rect>
    <circle cx="120" cy="290" r="7" fill="#e6edf3"><animate attributeName="cx" values="120;1080;1080" keyTimes="0;0.9;1" dur="8.0s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.88;0.92;1" dur="8.0s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="290" r="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="120" cy="290" r="24" fill="none" stroke="url(#acento)" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0.0000;0.0001;0.0100;0.2000;1.0000" dur="8.0s" repeatCount="indefinite"/></circle><text x="120" y="296" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">1</text><text x="120" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Crear repo</text>
    <circle cx="360" cy="290" r="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="360" cy="290" r="24" fill="none" stroke="url(#acento)" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0.0000;0.2150;0.2350;0.4250;1.0000" dur="8.0s" repeatCount="indefinite"/></circle><text x="360" y="296" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">2</text><text x="360" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Clonar</text>
    <circle cx="600" cy="290" r="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="600" cy="290" r="24" fill="none" stroke="url(#acento)" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0.0000;0.4400;0.4600;0.6500;1.0000" dur="8.0s" repeatCount="indefinite"/></circle><text x="600" y="296" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">3</text><text x="600" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Commit</text>
    <circle cx="840" cy="290" r="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="840" cy="290" r="24" fill="none" stroke="url(#acento)" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0.0000;0.6650;0.6850;0.8750;1.0000" dur="8.0s" repeatCount="indefinite"/></circle><text x="840" y="296" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">4</text><text x="840" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Push</text>
    <circle cx="1080" cy="290" r="24" fill="#0d1117" stroke="#30363d" stroke-width="2"/><circle cx="1080" cy="290" r="24" fill="none" stroke="url(#acento)" stroke-width="3" opacity="0.25"><animate attributeName="opacity" values="0.25;0.25;1;0.4;0.25" keyTimes="0.0000;0.8900;0.9100;1.0000;1.0000" dur="8.0s" repeatCount="indefinite"/></circle><text x="1080" y="296" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">5</text><text x="1080" y="340" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Pull request</text>
  </g>
</svg>
