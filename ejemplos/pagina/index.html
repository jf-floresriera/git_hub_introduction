<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi primera página en GitHub Pages</title>
  <style>
    :root { --fondo: #0d1117; --panel: #161b22; --borde: #30363d; --texto: #e6edf3; --suave: #8b949e; --verde: #3fb950; --azul: #2f81f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
           font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    main { width: min(680px, 92vw); padding: 48px; background: var(--panel); border: 1px solid var(--borde); border-radius: 16px; }
    .etiqueta { font-family: Consolas, "Liberation Mono", monospace; color: var(--verde); letter-spacing: 3px; font-size: 13px; }
    h1 { margin: 12px 0 8px; font-size: 40px; }
    p { color: var(--suave); line-height: 1.6; }
    a { color: var(--azul); }
    .barra { height: 4px; border-radius: 2px; margin-top: 32px; background: linear-gradient(90deg, var(--azul), var(--verde));
             background-size: 200% 100%; animation: mover 4s linear infinite; }
    @keyframes mover { from { background-position: 0 0; } to { background-position: 200% 0; } }
    @media (prefers-reduced-motion: reduce) { .barra { animation: none; } }
  </style>
</head>
<body>
  <main>
    <div class="etiqueta">PUBLICADO CON GITHUB PAGES</div>
    <h1>Tu Nombre</h1>
    <p>Escribe aquí una descripción breve: qué estudias, en qué trabajas y qué proyectos tienes.</p>
    <p>Mis repositorios: <a href="https://github.com/TU_USUARIO">github.com/TU_USUARIO</a></p>
    <div class="barra"></div>
  </main>
</body>
</html>
